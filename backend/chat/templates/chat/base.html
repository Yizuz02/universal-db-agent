{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full" data-theme="light" data-font-family="system" style="font-size: 16px">
<head>

    <meta charset="UTF-8">

    <title>{% block title %}Universal DB Agent{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>

    <script>
    tailwind.config = {
        darkMode: "class",

        theme: {
            extend: {

                colors: {

                    primary: "var(--color-primary)",
                    "primary-hover": "var(--color-primary-hover)",
                    "primary-foreground": "var(--color-primary-foreground)",
                    "primary-subtle": "var(--color-primary-subtle)",

                    page: "var(--color-page)",
                    "page-dark": "var(--color-page-dark)",

                    surface: "var(--color-surface)",
                    "surface-dark": "var(--color-surface-dark)",
                    "surface-elevated": "var(--color-surface-elevated)",

                    border: "var(--color-border)",
                    "border-dark": "var(--color-border-dark)",

                    text: "var(--color-text)",
                    "text-muted": "var(--color-text-muted)",
                    "text-dark": "var(--color-text-dark)",
                    "text-dark-muted": "var(--color-text-dark-muted)",

                }

            }
        }
    }
    </script>

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=block"
    />

    <style>
    .material-symbols-outlined {
        font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24;
    }

    /* ============================================================
       THEME TOKENS — each [data-theme="X"] sets all colour slots
       ============================================================ */

    :root {
        --font-size: 16px;
        --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
    }

    :root,
    [data-theme="light"] {
        --color-primary: #0891b2;
        --color-primary-hover: #0e7490;
        --color-primary-foreground: #ffffff;
        --color-primary-subtle: #cffafe;

        --color-page: #f1f5f9;
        --color-page-dark: #020617;

        --color-surface: #ffffff;
        --color-surface-dark: #0f172a;
        --color-surface-elevated: #1e293b;

        --color-border: #e2e8f0;
        --color-border-dark: #334155;

        --color-text: #0f172a;
        --color-text-muted: #64748b;
        --color-text-dark: #f8fafc;
        --color-text-dark-muted: #94a3b8;
    }

    /* ---- Dark (always-dark variant) ---- */
    [data-theme="dark"] {
        --color-primary: #22d3ee;
        --color-primary-hover: #06b6d4;
        --color-primary-foreground: #020617;
        --color-primary-subtle: #083344;

        --color-page: #0f172a;
        --color-page-dark: #020617;

        --color-surface: #1e293b;
        --color-surface-dark: #0f172a;
        --color-surface-elevated: #334155;

        --color-border: #334155;
        --color-border-dark: #1e293b;

        --color-text: #f8fafc;
        --color-text-muted: #94a3b8;
        --color-text-dark: #e2e8f0;
        --color-text-dark-muted: #64748b;
    }

    /* ---- Ocean (blues) ---- */
    [data-theme="ocean"] {
        --color-primary: #2563eb;
        --color-primary-hover: #1d4ed8;
        --color-primary-foreground: #ffffff;
        --color-primary-subtle: #dbeafe;

        --color-page: #eff6ff;
        --color-page-dark: #0a1628;

        --color-surface: #ffffff;
        --color-surface-dark: #0f1a2e;
        --color-surface-elevated: #1a2d4a;

        --color-border: #bfdbfe;
        --color-border-dark: #1e3a5f;

        --color-text: #172554;
        --color-text-muted: #64748b;
        --color-text-dark: #e0f2fe;
        --color-text-dark-muted: #7ca2c2;
    }

    /* ---- Matrix (neon green / terminal) ---- */
    [data-theme="matrix"] {
        --color-primary: #00ff41;
        --color-primary-hover: #00cc33;
        --color-primary-foreground: #000000;
        --color-primary-subtle: #003d0d;

        --color-page: #0d1117;
        --color-page-dark: #000000;

        --color-surface: #161b22;
        --color-surface-dark: #0a0a0a;
        --color-surface-elevated: #1c2128;

        --color-border: #00ff4144;
        --color-border-dark: #00ff4122;

        --color-text: #00ff41;
        --color-text-muted: #00cc3377;
        --color-text-dark: #33ff77;
        --color-text-dark-muted: #00aa3377;
    }

    /* ---- Sunset (warm oranges) ---- */
    [data-theme="sunset"] {
        --color-primary: #f97316;
        --color-primary-hover: #ea580c;
        --color-primary-foreground: #ffffff;
        --color-primary-subtle: #ffedd5;

        --color-page: #fffbeb;
        --color-page-dark: #1c1512;

        --color-surface: #ffffff;
        --color-surface-dark: #2a1f1a;
        --color-surface-elevated: #3d2d25;

        --color-border: #fed7aa;
        --color-border-dark: #5c4033;

        --color-text: #431407;
        --color-text-muted: #a16207;
        --color-text-dark: #fef3c7;
        --color-text-dark-muted: #d48a55;
    }

    /* ---- Blush (roses) ---- */
    [data-theme="blush"] {
        --color-primary: #e11d48;
        --color-primary-hover: #be123c;
        --color-primary-foreground: #ffffff;
        --color-primary-subtle: #ffe4e6;

        --color-page: #fff1f2;
        --color-page-dark: #1f1117;

        --color-surface: #ffffff;
        --color-surface-dark: #2d161f;
        --color-surface-elevated: #3d1e2a;

        --color-border: #fecdd3;
        --color-border-dark: #5c2a3a;

        --color-text: #4c0519;
        --color-text-muted: #9f1239;
        --color-text-dark: #ffe4e6;
        --color-text-dark-muted: #d46a82;
    }

    /* ---- Synthwave / Tokyo Night ---- */
    [data-theme="synthwave"] {
        --color-primary: #7aa2f7;
        --color-primary-hover: #5d8fe8;
        --color-primary-foreground: #1a1b2e;
        --color-primary-subtle: #2a2b4e;

        --color-page: #1a1b2e;
        --color-page-dark: #0f0f1a;

        --color-surface: #24263b;
        --color-surface-dark: #16161e;
        --color-surface-elevated: #2f3148;

        --color-border: #3b3d5c;
        --color-border-dark: #2a2a3e;

        --color-text: #c0caf5;
        --color-text-muted: #7c7fa0;
        --color-text-dark: #a9b1d6;
        --color-text-dark-muted: #56587a;
    }

    /* ---- Graphite (neutral greys) ---- */
    [data-theme="graphite"] {
        --color-primary: #78716c;
        --color-primary-hover: #57534e;
        --color-primary-foreground: #ffffff;
        --color-primary-subtle: #f5f5f4;

        --color-page: #f5f5f4;
        --color-page-dark: #1c1917;

        --color-surface: #ffffff;
        --color-surface-dark: #292524;
        --color-surface-elevated: #44403c;

        --color-border: #d6d3d1;
        --color-border-dark: #44403c;

        --color-text: #1c1917;
        --color-text-muted: #78716c;
        --color-text-dark: #f5f5f4;
        --color-text-dark-muted: #a8a29e;
    }
    /* Font families */
    [data-font-family="system"] { --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; }
    [data-font-family="serif"]  { --font-family: Georgia, "Times New Roman", serif; }
    [data-font-family="mono"]   { --font-family: "JetBrains Mono", "Fira Code", "Consolas", "Courier New", monospace; }
    [data-font-family="rounded"] { --font-family: "Nunito", "Quicksand", system-ui, sans-serif; }

    body {
        font-size: var(--font-size);
        font-family: var(--font-family);
    }

    /* Active state for settings buttons — replaces N classList.toggles with 1 */
    .theme-btn.active,
    .size-btn.active,
    .family-btn.active,
    .lang-btn.active {
        background-color: var(--color-primary) !important;
        color: var(--color-primary-foreground) !important;
        border-color: var(--color-primary) !important;
    }
    .theme-btn:not(.active),
    .size-btn:not(.active),
    .family-btn:not(.active),
    .lang-btn:not(.active) {
        background-color: var(--color-page);
        color: var(--color-text);
        border-color: var(--color-border);
    }
    .dark .theme-btn:not(.active),
    .dark .size-btn:not(.active),
    .dark .family-btn:not(.active),
    .dark .lang-btn:not(.active) {
        background-color: var(--color-surface-elevated);
        color: var(--color-text-dark);
        border-color: var(--color-border-dark);
    }
    </style>

    {% if theme == "matrix" or theme == "synthwave" %}
    <style>
        /* Matrix terminal font */
        [data-theme="matrix"] body,
        [data-theme="matrix"] textarea,
        [data-theme="matrix"] input {
            font-family: 'Courier New', 'Consolas', 'Monaco', monospace !important;
        }
        [data-theme="matrix"] .material-symbols-outlined {
            font-family: 'Material Symbols Outlined' !important;
        }
        /* Synthwave glow accents */
        [data-theme="synthwave"] .bg-primary {
            box-shadow: 0 0 12px rgba(122, 162, 247, 0.3);
        }
    </style>
    {% endif %}

</head>

<body class="h-full bg-page dark:bg-page-dark">

{% block content %}

{% endblock %}

</body>
</html>
